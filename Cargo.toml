[package]
name = "chicalipdf"
version = "0.1.0"
edition = "2021"
description = "A lightweight PDF viewer with sidecar versioning"
license = "MIT"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["image", "wgpu"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }
mupdf = "0.4"
image = "0.25"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
